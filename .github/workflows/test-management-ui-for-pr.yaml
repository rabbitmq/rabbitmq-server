name: Test Management UI with Selenium for PRs
on:
  pull_request:
    paths:
      - deps/rabbitmq_management/src/**
      - deps/rabbitmq_management/priv/**
      - deps/rabbitmq_web_dispatch/src/**
      - selenium/**
      - scripts/**
      - .github/workflows/test-management-ui-for-pr.yaml
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  selenium:
    runs-on: ubuntu-latest
    # Hard timeout of 1h. This should be more than sufficient to complete. If the workflow times outputs,
    # it very likely there's an issue with either infra or some script.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        erlang_version:
        - "29.1"
        browser:
        - chrome
        include:
        - erlang_version: "29.1"
          elixir_version: "1.20"
    env:
      SELENIUM_DIR: selenium
      DOCKER_NETWORK: rabbitmq_net
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Configure OTP & Elixir
      uses: erlef/setup-beam@v1
      with:
        otp-version: ${{ matrix.erlang_version }}
        elixir-version: ${{ matrix.elixir_version }}
        hexpm-mirrors: |
          https://builds.hex.pm
          https://cdn.jsdelivr.net/hex

    - name: Build & Load RabbitMQ OCI
      run: |
         make package-generic-unix
         make docker-image OTP_VERSION=${{ matrix.erlang_version }}

    - name: Configure Docker Network
      run: |
        docker network create ${DOCKER_NETWORK}

    - name: Build Test Runner Image
      run: |
        cd ${SELENIUM_DIR}
        docker build -t mocha-test --target test .

    - name: Select the suite to run
      id: suite
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        SUITE=short-suite-management-ui
        # A line `run-suite <name>` in the message of the latest commit selects another suite
        git fetch --no-tags --depth=1 origin "refs/pull/${PR_NUMBER}/head"
        REQUESTED=$(git log -1 --format=%B FETCH_HEAD | sed -nE 's/^run-suite[[:space:]]+([A-Za-z0-9_./-]+)[[:space:]]*$/\1/p' | head -n 1)
        if [ -n "$REQUESTED" ]; then
          case "$REQUESTED" in
            *..*|/*)
              echo "::warning::Ignoring suite '$REQUESTED' requested via commit log"
              ;;
            *)
              if [ -e "${SELENIUM_DIR}/${REQUESTED}" ] || [ -e "${SELENIUM_DIR}/suites/${REQUESTED}" ]; then
                echo "Running suite triggered via commit log : ${REQUESTED}"
                SUITE="$REQUESTED"
              else
                echo "::warning::Ignoring unknown suite '$REQUESTED' requested via commit log"
              fi
              ;;
          esac
        fi
        echo "name=${SUITE}" >> "$GITHUB_OUTPUT"

    - name: Run UI suites on a standalone rabbitmq server
      id: tests
      env:
        SUITE_NAME: ${{ steps.suite.outputs.name }}
      run: |
        export IMAGE_TAG=$(find PACKAGES/rabbitmq-server-generic-unix-*.tar.xz | awk -F 'PACKAGES/rabbitmq-server-generic-unix-|.tar.xz' '{print $2}')
        export CONF_DIR_PREFIX="$(mktemp -d)" 
        export RABBITMQ_DOCKER_IMAGE=pivotalrabbitmq/rabbitmq:$IMAGE_TAG
        echo "Running selenium tests with "
        echo " - CONF_DIR_PREFIX: ${CONF_DIR_PREFIX}"
        echo " - IMAGE_TAG: ${IMAGE_TAG}"
        echo " - RABBITMQ_DOCKER_IMAGE: ${RABBITMQ_DOCKER_IMAGE}"       
        echo "SELENIUM_ARTIFACTS=${CONF_DIR_PREFIX}" >> $GITHUB_ENV
        echo " - SUITE: ${SUITE_NAME}"
        ${SELENIUM_DIR}/run-suites.sh "${SUITE_NAME}"
      
    - name: Upload Test Artifacts
      if: ${{ failure() && steps.tests.outcome == 'failure' }}
      uses: actions/upload-artifact@v7
      with:
        name: test-artifacts-${{ matrix.browser }}-${{ matrix.erlang_version }}
        path: ${{ env.SELENIUM_ARTIFACTS }}/*

