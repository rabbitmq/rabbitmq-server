name: Nightly OCI (make)
on:
  schedule:
    # at 2:20am Mon-Fri
    # GitHub advises to schedule jobs NOT at the start of the hour
    # https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/events-that-trigger-workflows#schedule
    - cron: 20 2 * * 1-5
  workflow_dispatch:

env:
  REGISTRY_IMAGE: pivotalrabbitmq/rabbitmq

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-package-generic-unix:
    strategy:
      fail-fast: false
      matrix:
        otp_version:
          - '27'
        branch:
          - main
          - v4.3.x
          - v4.2.x
          - v4.1.x
        include:
          - branch: main
            project_version: 4.4.0
          - branch: v4.3.x
            project_version: 4.3.0

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.branch }}
          fetch-tags: true
          fetch-depth: 0
          filter: blob:none

      - name: Determine closest tag
        id: tag
        if: matrix.branch != 'main'
        shell: bash
        run: |
          t=$(git describe --tags --abbrev=0 ${{ matrix.branch }})
          printf "project_version=%s\n" "${t:1}" | tee -a "$GITHUB_OUTPUT"

      - name: Get current SHA
        id: sha
        shell: bash
        run: |
          sha=$(git rev-parse HEAD)
          printf "current_sha=%s\n" "$sha" | tee -a "$GITHUB_OUTPUT"

      - name: Configure Erlang
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ matrix.otp_version }}
          elixir-version: latest

      - name: make package-generic-unix
        id: make
        run: |
          make package-generic-unix PROJECT_VERSION=${{ matrix.project_version || steps.tag.outputs.project_version }}+${{ steps.sha.outputs.current_sha }}

      - name: Upload package-generic-unix
        uses: actions/upload-artifact@v7
        with:
          name: package-generic-unix-otp${{ matrix.otp_version }}-${{ matrix.branch }}
          path: PACKAGES/rabbitmq-server-*.tar.xz

  build-and-push:
    strategy:
      fail-fast: false
      matrix:
        otp_version:
          - '27'
        branch:
          - main
          - v4.3.x
          - v4.2.x
          - v4.1.x

    needs: build-package-generic-unix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.branch }}

      - name: Get current SHA
        id: sha
        shell: bash
        run: |
          sha=$(git rev-parse HEAD)
          printf "current_sha=%s\n" "$sha" | tee -a "$GITHUB_OUTPUT"

      - name: Download package-generic-unix
        uses: actions/download-artifact@v8
        with:
          name: package-generic-unix-otp${{ matrix.otp_version }}-${{ matrix.branch }}
          path: PACKAGES

      - name: Rename package-generic-unix
        run: |
          cp \
            PACKAGES/rabbitmq-server-generic-unix-*.tar.xz \
            packaging/docker-image/package-generic-unix.tar.xz

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          flavor: |
            suffix=-otp${{ matrix.otp_version }}
          tags: |
            type=sha,format=long
            type=schedule,pattern=nightly.{{date 'YYYYMMDD'}},prefix=${{ matrix.branch }}-
            type=raw,value=${{ matrix.branch }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
<<<<<<< HEAD
        uses: docker/login-action@v4
=======
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
>>>>>>> 2967570 (Use sha to pin potentially sensitive actions)
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: true
          context: packaging/docker-image
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          cache-to: type=gha,mode=max,scope=${{ matrix.otp_version }}
          cache-from: type=gha,scope=${{ matrix.otp_version }}
          build-args: |
            OTP_VERSION=${{ matrix.otp_version }}
            RABBITMQ_VERSION=${{ matrix.branch }}+${{ steps.sha.outputs.current_sha }}
