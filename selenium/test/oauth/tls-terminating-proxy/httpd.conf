ServerRoot "/usr/local/apache2"

Listen 8444

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule headers_module modules/mod_headers.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
LoadModule ssl_module modules/mod_ssl.so
LoadModule unixd_module modules/mod_unixd.so

<IfModule unixd_module>
User www-data
Group www-data
</IfModule>

ServerName ${PUBLIC_RABBITMQ_HOST}

ErrorLog /proc/self/fd/2
LogLevel warn

<IfModule log_config_module>
    LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
    LogFormat "%h %l %u %t \"%r\" %>s %b" common
    CustomLog /proc/self/fd/1 common
</IfModule>

<IfModule ssl_module>
SSLRandomSeed startup builtin
SSLRandomSeed connect builtin
</IfModule>

<VirtualHost *:8444>
  ServerName "tls-terminating-proxy"
  ProxyPreserveHost Off
  ProxyRequests On
  
  SSLEngine on
  SSLCertificateFile "/usr/local/apache2/conf/server_tls-terminating-proxy_certificate.pem"
  SSLCertificateKeyFile "/usr/local/apache2/conf/server_tls-terminating-proxy_key.pem"
  
  RequestHeader set X-Forwarded-Proto "https"
  RequestHeader set X-Forwarded-Host "${PUBLIC_RABBITMQ_HOST}"
  RequestHeader set X-Forwarded-Port "8444"
  
  AllowEncodedSlashes NoDecode
  ProxyPass / http://${RABBITMQ_HOST_FOR_PROXY}${RABBITMQ_PATH}/ nocanon
  ProxyPass /api http://${RABBITMQ_HOST_FOR_PROXY}${RABBITMQ_PATH}/api nocanon
  ProxyPassReverse / http://${RABBITMQ_HOST_FOR_PROXY}${RABBITMQ_PATH}/
</VirtualHost>
