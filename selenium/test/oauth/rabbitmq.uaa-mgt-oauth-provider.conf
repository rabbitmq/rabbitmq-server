# uaa requires a secret in order to renew tokens
management.oauth_client_secret = ${OAUTH_CLIENT_SECRET}

# uaa requires a secret in order to renew tokens
management.oauth_provider_url = ${UAA_URL}

# the token endpoint proxy uses this CA to verify UAA's certificate
auth_oauth2.https.cacertfile = ${OAUTH_SERVER_CONFIG_DIR}/ca_uaa_certificate.pem

# UAA's issuer is its token endpoint URL rather than a prefix of its
# discovery endpoint, so it does not satisfy the discovery issuer check.
auth_oauth2.discovery.verify_issuer = false
